[package]
name = "cfprobe"
version = "0.1.0"
edition = "2024"

license = "MIT"
description = "Cloudflare reverse proxy and CDN detection engine"
repository = "https://github.com/your-org/cfprobe"
readme = "README.md"
keywords = ["cloudflare", "cdn", "network", "security", "probe"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
ipnet = "2.12.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fs2 = "0.4.3"
directories = "6"
async-trait = "0.1.92"
futures = "0.3.34"


atomic-write-file = "0.3.1"
tokio = { version = "1.53.1", features = ["fs","sync","macros", "rt-multi-thread", "net", "time"] }
hickory-resolver = "0.26.1"

tokio-rustls = "0.26.4"
rustls = "0.23.43"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
rcgen = "0.14.9"
tokio = { version = "1.53.1", features = ["fs","sync","macros", "rt-multi-thread", "net", "time"] }
