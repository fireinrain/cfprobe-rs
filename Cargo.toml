[package]
name = "cfprobe"
version = "0.1.0"
edition = "2024"

license = "MIT"
description = "Cloudflare reverse proxy and CDN detection engine"
repository = "https://github.com/your-org/cfprobe"
readme = "README.md"
keywords = ["cloudflare", "cdn", "network", "security", "probe"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
ipnet = "2.12.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "http2",
    "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fs2 = "0.4.3"
directories = "6"
async-trait = "0.1.92"
futures = "0.3.34"


tokio-util = "0.7.19"

atomic-write-file = "0.3.1"
tokio = { version = "1.53.1", features = [
    "fs",
    "sync",
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "signal",
] }
hickory-resolver = { version = "0.26.1", features = ["https-ring"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
sha2 = "0.11.0"
hex = "0.4.3"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive","env"] }
tracing = "0.1.44"

tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
] }
tower-http = { version = "0.7.0", features = ["trace"] }

uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
rcgen = "0.14.9"
tokio = { version = "1.53.1", features = [
    "fs",
    "sync",
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "signal",
] }